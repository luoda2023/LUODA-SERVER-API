<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>点聊管理中心</title>
  <link rel="stylesheet" href="assets/admin.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <section class="login-view" data-view="login">
      <div class="login-card">
        <div class="brand-mark">D</div>
        <p class="eyebrow">DOTCHAT SERVER</p>
        <h1 id="loginTitle">管理后台</h1>
        <p class="login-subtitle">中继服务器、设备与账号的统一配置中心</p>
        <form id="loginForm" class="form-stack">
          <label>用户名<input name="username" autocomplete="username" required placeholder="请输入管理员账号" /></label>
          <label>密码<input name="password" type="password" autocomplete="current-password" required placeholder="请输入密码" /></label>
          <div id="captchaBox" class="captcha-box hidden">
            <label>验证码<input name="captcha" placeholder="请输入验证码" /></label>
            <img id="captchaImage" alt="验证码" />
          </div>
          <button class="primary-btn" type="submit">登录控制台</button>
          <p id="loginMessage" class="form-message"></p>
        </form>
      </div>
    </section>

    <section class="dashboard-view hidden" data-view="dashboard">
      <aside class="sidebar">
        <div class="sidebar-brand"><span>D</span><strong>点聊</strong></div>
        <nav id="nav"></nav>
        <button id="logoutBtn" class="ghost-btn">退出登录</button>
      </aside>
      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">配置中心</p>
            <h2 id="pageTitle">总览</h2>
          </div>
          <div class="top-actions">
            <button id="refreshBtn" class="secondary-btn">刷新</button>
            <a class="secondary-btn" href="/admin/swagger/index.html" target="_blank">API 文档</a>
          </div>
        </header>
        <section id="notice" class="notice hidden"></section>
        <section id="content" class="content-grid"></section>
      </main>
    </section>
  </div>
  <script src="assets/admin.js"></script>
</body>
</html>
