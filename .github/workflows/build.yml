name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: luoda2023/luoda-server

jobs:
  # ─── 并行编译各架构 Rust 二进制并推送架构镜像 ───
  build-arch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            s6_arch: x86_64

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cross
        run: |
          curl -fsSL https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-gnu.tar.gz | sudo tar xz -C /usr/local/bin
          cross --version

      - name: Build Rust binaries with cross
        run: |
          cross build --release --target ${{ matrix.target }}
          mkdir -p build
          cp target/${{ matrix.target }}/release/hbbs build/
          cp target/${{ matrix.target }}/release/hbbr build/
          cp target/${{ matrix.target }}/release/luoda-utils build/
          ls -la build/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go API
        run: |
          mkdir -p build
          cd api
          go mod tidy
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -o ../build/luoda-api ./cmd/apimain.go
          cd ..
          ls -la build/

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push Docker image (direct)
        run: |
          set -ex
          echo "=== Build context debug ==="
          echo "--- docker/rootfs ---"
          find docker/rootfs -type f 2>&1 || echo "NO docker/rootfs"
          echo "--- build/ ---"
          ls -la build/ 2>&1 || echo "NO build/"
          echo "--- Dockerfile ---"
          cat Dockerfile
          echo "--- Building ---"
          docker build -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main" .
          echo "--- Pushing ---"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"
          echo "=== DONE ==="
          provenance: false

  # ─── 最终镜像 tag ───
  retag:
    needs: build-arch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create final tags (amd64 only)
        run: |
          set -ex
          docker buildx imagetools create \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            docker buildx imagetools create \
              --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG_NAME}" \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"
          fi